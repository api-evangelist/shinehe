name: Shinehe (Hangzhou Xinzeyuan Medical Technology)
description: >-
  Shinehe (Hangzhou Xinzeyuan Medical Technology Co., Ltd. / 杭州鑫泽源医疗科技有限公司)
  is a Hangzhou, China based contract development and manufacturing organization
  (CDMO) for the minimally invasive medical device sector. Founded in 2015, the
  company provides precision component manufacturing, customized development, and
  OEM/ODM services covering endoscope accessories (insertion, operation, and light
  guide components), single-use consumables (hemostasis, biopsy, EMR, dilation),
  rigid endoscope components, and minimally invasive surgical instruments, aiming
  to be a global minimally invasive medical device supply-chain platform. Surfaced
  as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network. No public API, developer portal, or SDK surface was found during
  enrichment; this profile is maintained as a company identity record.
